spring:
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"
  application:
    name: configserver
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Yas-sin-e/config-repo.git
          default-label: main
          clone-on-start: true
        monitor:
          validation-filter-enabled: false
          github:
            validation-enabled: false
            webhook-secret: ${GITHUB_WEBHOOK_SECRET}

server:
  port: 9999
management:
  endpoints:
    web:
      exposure:
        include: '*'
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.cloud.config.monitor: DEBUG
