services:
  mysqldb:
    image: mysql
    container_name: mysqldb
    ports:
      - '3306:3306'
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test

  grade-ms:
    build: ./grade-microservices
    container_name: grade-ms
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/test"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysqldb:
          condition: service_healthy

#services_helathy va lancer le test

# healthcheck  : teste la sante
#je ne peux demarrer le deuxieme microservice grade que lorsque on a bien demarre MYsql