server:
  port: 8080

spring:
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:http://localhost:9999/"
    #optional: si le serveur est n'esp demarer  contenu n'affiche pas d'erreure

  application:
    name: grade
  datasource:
    url: 'jdbc:h2:mem:gradedb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
eureka:
  instance:
    prefer-ip-address: true
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
management:
  endpoints:
    web:
      exposure:
        include: '*'

build :
  version: 1.0
author: #on ajouter ca parce que j'ai dans le config prefix = "author"
  name: "yassine aounallah"
  email: "yassineaounallah22@gmail.com"


