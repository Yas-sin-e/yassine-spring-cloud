server:
  port: 8080

spring:
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:http://localhost:9999/"
    #optional: si le serveur est n'esp demarer  contenu n'affiche pas d'erreure

  application:
    name: grade
  datasource:
    url: 'jdbc:h2:mem:gradedb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true
  eureka:
    client:
      service-url:
        defaultZone: 'http://localhost:8761/eureka/'
management:
  endpoints:
    web:
      exposure:
        include: '*'
eureka:
  instance:
    prefer-ip-address: true

