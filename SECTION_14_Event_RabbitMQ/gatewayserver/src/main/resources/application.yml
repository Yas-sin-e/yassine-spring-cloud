server:
  port: 8888

spring:

  application:
    name: gatewayserver
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
#          routes:
#            - id : r1
#              uri : lb://GRADE
#              predicates:
#                - Path=/api/Grade/**
#            - id: r2
#              uri: lb://EMPLOYEE
#              predicates:
#                - Path=/api/employes/**
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8090/realms/master/protocol/openid-connect/certs"
eureka:
  client:
    register-with-eureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
      instance:
        prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
#pour activer le enpoint 8888/actuator/gateway/routes
  endpoint:
    gateway:
      access: unrestricted

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000

